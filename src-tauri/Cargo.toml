[package]
name = "wigl"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wigl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
portable-pty = "0.9"


# Release is what runs 24/7; debug builds are unoptimized (the cursor poller
# alone was ~10x costlier there). No `panic = "abort"`: tao's event loop
# catches panics (stop_app_on_panic) and a stray `unwrap` in a poller thread
# shouldn't take every widget down with it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
