name: test

# Opt-in only — running the suite on every push is noise. Trigger by hand
# (`bun run test:ci`, or `gh workflow run test.yml`) or let a version tag
# run it automatically.
#
# Runs `bun run test:core` — src/wigl coverage + tests/e2e, no per-widget
# deps (widget tests need per-widget `bun install` and, for LocalCode, a
# live opencode/ollama server — not CI's job; widgets are Unix-specific and
# interchangeable per AGENTS.md). tests/e2e (widget authoring tooling) runs
# on all three OSes. The Tauri GUI and `bun run verify`/`qa` are
# macOS/Linux-only and not exercised here — CI has no display. Perf stays
# manual (tests/manual/, see AGENTS.md).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:core
